<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <!-- Upward arrow gradient: Cyan/Blue -> Green -> Yellow -->
    <linearGradient id="arrowGradient" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="25%" stop-color="#0ea5e9"/>
      <stop offset="55%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>

    <!-- Floor reflection fade gradient -->
    <linearGradient id="reflectFade" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="main-logo" filter="url(#logoGlow)">
    <!-- Upward Arrow Column & Head with Curving Swoosh Base -->
    <!-- Base width: 20 to 300, curves inwards to width 110-210, rises to arrow head -->
    <path d="
      M 160 15
      L 245 105
      L 205 105
      L 205 190
      Q 205 260 305 310
      L 15 310
      Q 115 260 115 190
      L 115 105
      L 75 105
      Z
    " fill="url(#arrowGradient)" />

    <!-- Two Silhouettes Helping Each Other Up on Left Slope -->
    <g id="figures" fill="#111827" stroke="#111827" stroke-linecap="round" stroke-linejoin="round">
      <!-- Upper Helper Figure -->
      <!-- Head -->
      <circle cx="120" cy="205" r="10" />
      <!-- Torso & Arms: leaning down, reaching left hand back to pull partner -->
      <path d="M 120 215 L 132 245 L 115 275 M 132 245 L 148 275" stroke-width="7" fill="none" />
      <!-- Extended Arm helping -->
      <path d="M 125 225 L 98 242 L 78 252" stroke-width="6" fill="none" />
      <!-- Forward arm for balance -->
      <path d="M 125 225 L 140 238" stroke-width="6" fill="none" />

      <!-- Lower Figure Being Pulled Up -->
      <!-- Head -->
      <circle cx="60" cy="250" r="9" />
      <!-- Torso & Climbing Legs -->
      <path d="M 60 259 L 48 288 L 32 310 M 48 288 L 62 310" stroke-width="6.5" fill="none" />
      <!-- Reaching Arm holding helper's hand -->
      <path d="M 60 266 L 78 252" stroke-width="5.5" fill="none" />
    </g>

    <!-- R H C Monogram in vibrant red inside top yellow portion -->
    <g id="rhc-text" fill="#dc2626" stroke="#dc2626">
      <!-- Calligraphic R with flourishes -->
      <path d="
        M 142 85
        Q 140 70 148 60
        Q 156 50 168 50
        Q 180 50 180 62
        Q 180 72 168 76
        L 182 92
        M 148 62
        L 168 62
        M 152 46
        Q 146 50 142 60
        Q 138 72 135 88
        M 154 50
        Q 166 42 176 46
      " stroke-width="4.5" fill="none" stroke-linecap="round" />

      <!-- Letter H -->
      <text x="160" y="125" text-anchor="middle" font-family="'Arial', 'Helvetica', sans-serif" font-weight="900" font-size="34" letter-spacing="1" stroke-width="1.2">
        H
      </text>

      <!-- Letter C -->
      <text x="160" y="162" text-anchor="middle" font-family="'Arial', 'Helvetica', sans-serif" font-weight="900" font-size="34" letter-spacing="1" stroke-width="1.2">
        C
      </text>
    </g>
  </g>

  <!-- Reflection Effect Underneath -->
  <g id="reflection" opacity="0.3" transform="translate(0, 620) scale(1, -1)">
    <path d="
      M 160 190
      Q 205 260 305 310
      L 15 310
      Q 115 260 115 190
      Z
    " fill="url(#arrowGradient)" />
    <!-- Fade overlay for reflection -->
    <rect x="0" y="270" width="320" height="70" fill="url(#reflectFade)" />
  </g>
</svg>
